# ===================================================================
# Spring Boot configuration for the "dev" profile.
#
# This configuration overrides the application.yml file.
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# ===================================================================

logging:
    level:
        ROOT: DEBUG
        com.kasztelanic.carcare: DEBUG

spring:
    devtools:
        restart:
            enabled: true
        livereload:
            enabled: false # we use Webpack dev server + BrowserSync for livereload
    jackson:
        serialization.indent_output: true
    datasource:
        type: com.zaxxer.hikari.HikariDataSource
        url: jdbc:mariadb://localhost:3306/carcare
        username: root
        password: pass
        hikari:
            poolName: Hikari
            auto-commit: false
            data-source-properties:
                cachePrepStmts: true
                prepStmtCacheSize: 250
                prepStmtCacheSqlLimit: 2048
                useServerPrepStmts: true
    jpa:
        database-platform: org.hibernate.dialect.MariaDBDialect
        database: MYSQL
        show-sql: true
        properties:
            hibernate.id.new_generator_mappings: true
            hibernate.connection.provider_disables_autocommit: true
            hibernate.cache.use_second_level_cache: true
            hibernate.cache.use_query_cache: false
            hibernate.generate_statistics: true
    liquibase:
        contexts: dev
    mail:
        host: localhost
        port: 25
        username:
        password:
    messages:
        cache-duration: PT1S # 1 second, see the ISO 8601 standard
    thymeleaf:
        cache: false

server:
    port: 8080

# ===================================================================
# Application specific properties
# ===================================================================

application:
    data-directory:
        location: data
    cache: # Cache configuration
        ehcache: # Ehcache configuration
            time-to-live-seconds: ${JHIPSTER_CACHE_EHCACHE_TIME_TO_LIVE_SECONDS:3600} # By default objects stay 1 hour in the cache
            max-entries: ${JHIPSTER_CACHE_EHCACHE_MAX_ENTRIES:100} # Number of objects in each cache entry
    # CORS is only enabled by default with the "dev" profile, so BrowserSync can access the API
    cors:
        allowed-origins: ${JHIPSTER_CORS_ALLOWED_ORIGINS:*}
        allowed-methods: ${JHIPSTER_CORS_ALLOWED_METHODS:*}
        allowed-headers: ${JHIPSTER_CORS_ALLOWED_HEADERS:*}
        exposed-headers: ${JHIPSTER_CORS_EXPOSED_HEADERS:Authorization,Link,X-Total-Count}
        allow-credentials: ${JHIPSTER_CORS_ALLOW_CREDENTIALS:true}
        max-age: ${JHIPSTER_CORS_MAX_AGE:1800}
    security:
        authentication:
            jwt:
                # Legacy plain-text secret. Empty by default so `base64-secret` below is used; kept as a
                # compatibility alias for deployments still setting JHIPSTER_SECURITY_AUTHENTICATION_JWT_SECRET.
                secret: ${JHIPSTER_SECURITY_AUTHENTICATION_JWT_SECRET:}
                # Development-only signing key, encoded as Base64. Freshly generated for this profile; it
                # has never signed a production token. Committing it is intentional — it keeps `./mvnw` a
                # one-command dev run — and is not a regression of the external-signing-key change.
                base64-secret: ${JHIPSTER_SECURITY_AUTHENTICATION_JWT_BASE64_SECRET:xm/zicMV4sjCXuh3xP0056YRl3vceznRDc3rodCVZhYOm39C2aSAw7z49EVioL97fhiu1HUXc0SfxvizPW2KWA==}
                # Token is valid 24 hours
                token-validity-in-seconds: ${JHIPSTER_SECURITY_AUTHENTICATION_JWT_TOKEN_VALIDITY_IN_SECONDS:86400}
                token-validity-in-seconds-for-remember-me: ${JHIPSTER_SECURITY_AUTHENTICATION_JWT_TOKEN_VALIDITY_IN_SECONDS_FOR_REMEMBER_ME:2592000}
    mail:
        base-url: ${JHIPSTER_MAIL_BASE_URL:http://127.0.0.1:8080}
    logging:
        use-json-format: ${JHIPSTER_LOGGING_USE_JSON_FORMAT:false} # By default, logs are not in Json format
        logstash: # Forward logs to logstash over a socket, used by LoggingConfiguration
            enabled: ${JHIPSTER_LOGGING_LOGSTASH_ENABLED:false}
            host: ${JHIPSTER_LOGGING_LOGSTASH_HOST:localhost}
            port: ${JHIPSTER_LOGGING_LOGSTASH_PORT:5000}
            queue-size: ${JHIPSTER_LOGGING_LOGSTASH_QUEUE_SIZE:512}
    audit-events:
        retention-period: ${JHIPSTER_AUDIT_EVENTS_RETENTION_PERIOD:30} # Number of days before audit events are deleted.
