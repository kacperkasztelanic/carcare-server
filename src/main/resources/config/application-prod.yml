# ===================================================================
# Spring Boot configuration for the "prod" profile.
#
# This configuration overrides the application.yml file.
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# ===================================================================

logging:
    level:
        ROOT: INFO
        com.kasztelanic.carcare: INFO

management:
    prometheus:
        metrics:
            export:
                enabled: false

spring:
    devtools:
        restart:
            enabled: false
        livereload:
            enabled: false
    datasource:
        type: com.zaxxer.hikari.HikariDataSource
        username: root
        password: ${SPRING_DATASOURCE_PASSWORD:}
        url: ${SPRING_DATASOURCE_URL:}
        hikari:
            poolName: Hikari
            auto-commit: false
            max-lifetime: 600000
            data-source-properties:
                cachePrepStmts: true
                prepStmtCacheSize: 250
                prepStmtCacheSqlLimit: 2048
                useServerPrepStmts: true
    jpa:
        database-platform: org.hibernate.dialect.MariaDBDialect
        database: MYSQL
        show-sql: false
        properties:
            hibernate.id.new_generator_mappings: true
            hibernate.connection.provider_disables_autocommit: true
            hibernate.cache.use_second_level_cache: true
            hibernate.cache.use_query_cache: false
            hibernate.generate_statistics: false
    liquibase:
        contexts: prod
    mail:
        password: ${MAIL_PASSWORD:}
    thymeleaf:
        cache: true

# ===================================================================
# To enable TLS in production, generate a certificate using:
# keytool -genkey -alias carcare -storetype PKCS12 -keyalg RSA -keysize 2048 -keystore keystore.p12 -validity 3650
#
# You can also use Let's Encrypt:
# https://maximilian-boehm.com/hp2121/Create-a-Java-Keystore-JKS-from-Let-s-Encrypt-Certificates.htm
#
# Then, modify the server.ssl properties so your "server" configuration looks like:
#
# server:
#    port: 443
#    ssl:
#        key-store: classpath:config/tls/keystore.p12
#        key-store-password: password
#        key-store-type: PKCS12
#        key-alias: carcare
#        # The ciphers suite enforce the security by deactivating some old and deprecated SSL cipher, this list was tested against SSL Labs (https://www.ssllabs.com/ssltest/)
#        ciphers: TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA,TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384 ,TLS_DHE_RSA_WITH_AES_128_GCM_SHA256 ,TLS_DHE_RSA_WITH_AES_256_GCM_SHA384 ,TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA256,TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA384,TLS_DHE_RSA_WITH_AES_128_CBC_SHA256,TLS_DHE_RSA_WITH_AES_128_CBC_SHA,TLS_DHE_RSA_WITH_AES_256_CBC_SHA256,TLS_DHE_RSA_WITH_AES_256_CBC_SHA,TLS_RSA_WITH_AES_128_GCM_SHA256,TLS_RSA_WITH_AES_256_GCM_SHA384,TLS_RSA_WITH_AES_128_CBC_SHA256,TLS_RSA_WITH_AES_256_CBC_SHA256,TLS_RSA_WITH_AES_128_CBC_SHA,TLS_RSA_WITH_AES_256_CBC_SHA,TLS_DHE_RSA_WITH_CAMELLIA_256_CBC_SHA,TLS_RSA_WITH_CAMELLIA_256_CBC_SHA,TLS_DHE_RSA_WITH_CAMELLIA_128_CBC_SHA,TLS_RSA_WITH_CAMELLIA_128_CBC_SHA
# ===================================================================
server:
    port: 8080
    compression:
        enabled: true
        mime-types: text/html,text/xml,text/plain,text/css, application/javascript, application/json
        min-response-size: 1024

# ===================================================================
# Application specific properties
# ===================================================================

application:
    data-directory:
        location: /home/jhipster/data
    cache: # Cache configuration
        ehcache: # Ehcache configuration
            time-to-live-seconds: ${JHIPSTER_CACHE_EHCACHE_TIME_TO_LIVE_SECONDS:3600} # By default objects stay 1 hour in the cache
            max-entries: ${JHIPSTER_CACHE_EHCACHE_MAX_ENTRIES:1000} # Number of objects in each cache entry
    security:
        authentication:
            jwt:
                # Legacy plain-text secret. Empty by default so `base64-secret` below is used; kept as a
                # compatibility alias for deployments still setting JHIPSTER_SECURITY_AUTHENTICATION_JWT_SECRET.
                secret: ${JHIPSTER_SECURITY_AUTHENTICATION_JWT_SECRET:}
                # This token must be encoded using Base64 (you can type `echo 'secret-key'|base64` on your command line)
                # As this is the PRODUCTION configuration, you MUST change the default key, and store it securely,
                # e.g. in the `APPLICATION_SECURITY_AUTHENTICATION_JWT_BASE64_SECRET` environment variable
                base64-secret: ${JHIPSTER_SECURITY_AUTHENTICATION_JWT_BASE64_SECRET:MzYyMjBiMTc3NGEwZmM5MmZlN2UzNTNmYTY0NWQxMzQ0ZmNjN2UyNjAyMmJiMmIzNTQ4NjRiNGEzNWVlNjQ5NGM1ODVmNmViNjE4MzcxMDA5OGFjNjI2MmYzZTJhZGZkZDFkYzIzYzQ0Njk2NWIwNmIyMWQyNWJiMTNmMGY5MDI=}
                # Token is valid 24 hours
                token-validity-in-seconds: ${JHIPSTER_SECURITY_AUTHENTICATION_JWT_TOKEN_VALIDITY_IN_SECONDS:86400}
                token-validity-in-seconds-for-remember-me: ${JHIPSTER_SECURITY_AUTHENTICATION_JWT_TOKEN_VALIDITY_IN_SECONDS_FOR_REMEMBER_ME:2592000}
    mail:
        base-url: ${JHIPSTER_MAIL_BASE_URL:${MAIL_BASE_URL:}} # Modify according to your server's URL
    logging:
        use-json-format: ${JHIPSTER_LOGGING_USE_JSON_FORMAT:false} # By default, logs are not in Json format
        logstash: # Forward logs to logstash over a socket, used by LoggingConfiguration
            enabled: ${JHIPSTER_LOGGING_LOGSTASH_ENABLED:false}
            host: ${JHIPSTER_LOGGING_LOGSTASH_HOST:localhost}
            port: ${JHIPSTER_LOGGING_LOGSTASH_PORT:5000}
            queue-size: ${JHIPSTER_LOGGING_LOGSTASH_QUEUE_SIZE:512}
    audit-events:
        retention-period: ${JHIPSTER_AUDIT_EVENTS_RETENTION_PERIOD:30} # Number of days before audit events are deleted.
