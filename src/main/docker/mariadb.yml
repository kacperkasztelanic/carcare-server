# ─────────────────────────────────────────────────────────────────────────────
# HISTORICAL — NOT DEPLOYED.
#
# The live deployment is Compose project `services`, config file
# /home/kacper/services/carcare.yml, in a separate private git repository, with
# secrets in a gitignored ~/services/.env. Nothing in THIS repository reads this
# file — no pom plugin, no CI job (verified 2026-08-30). See AGENTS.md
# § Deployment for the verified topology.
#
# The ${MARIADB_PASSWORD_ENV} placeholder below is consumed only by the
# superseded, destructive deploy.sh, whose `sed -i` rewrites it IN PLACE — one
# run consumes this template permanently.
# ─────────────────────────────────────────────────────────────────────────────
services:
    carcare-mariadb:
        image: mariadb:10.11.6
        container_name: carcare-mariadb
        volumes:
            - ~/carcare/data/mysql/:/var/lib/mysql/
        environment:
            - MYSQL_USER=root
            - MYSQL_ROOT_PASSWORD=${MARIADB_PASSWORD_ENV}
            - MYSQL_ALLOW_EMPTY_PASSWORD=no
            - MYSQL_DATABASE=carcare
        expose:
            - "3306"
        command: [mysqld, --lower_case_table_names=1, --skip-ssl, --character_set_server=utf8mb4, --collation-server=utf8mb4_unicode_ci, --explicit_defaults_for_timestamp, --max_allowed_packet=32505856, --wait_timeout=600000, --log-warnings=0]
