# ===================================================================
# Spring Boot configuration.
#
# This configuration is used for unit/integration tests.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
# ===================================================================


spring:
    application:
        name: carcare
    datasource:
        type: com.zaxxer.hikari.HikariDataSource
        url: jdbc:h2:mem:carcare;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
        name:
        username:
        password:
        hikari:
            auto-commit: false
    jpa:
        database-platform: tech.jhipster.domain.util.FixedH2Dialect
        database: H2
        open-in-view: false
        show-sql: false
        hibernate:
            ddl-auto: none
            naming:
                physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
                implicit-strategy: org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
        properties:
            hibernate.id.new_generator_mappings: true
            hibernate.connection.provider_disables_autocommit: true
            hibernate.cache.use_second_level_cache: false
            hibernate.cache.use_query_cache: false
            hibernate.generate_statistics: true
            hibernate.hbm2ddl.auto: validate
            hibernate.jdbc.time_zone: UTC
    liquibase:
        contexts: test
    mail:
        host: localhost
    main:
            allow-bean-definition-overriding: true
    messages:
        basename: i18n/messages
    task:
        execution:
            thread-name-prefix: carcare-task-
            pool:
                core-size: 1
                max-size: 50
                queue-capacity: 10000
        scheduling:
            thread-name-prefix: carcare-scheduling-
            pool:
                size: 1
    thymeleaf:
        mode: HTML


server:
    port: 10344
    address: localhost

info:
    project:
        version: #project.version#

# ===================================================================
# Application specific properties
# Add your own application properties here, see the ApplicationProperties class
# to have type-safe configuration.
# ===================================================================

application:
    data-directory:
        location: data
    logging:
        # To test json console appender
        use-json-format: ${JHIPSTER_LOGGING_USE_JSON_FORMAT:true} # By default, logs are in Json format
        logstash:
            enabled: ${JHIPSTER_LOGGING_LOGSTASH_ENABLED:false}
            host: ${JHIPSTER_LOGGING_LOGSTASH_HOST:localhost}
            port: ${JHIPSTER_LOGGING_LOGSTASH_PORT:5000}
            queue-size: ${JHIPSTER_LOGGING_LOGSTASH_QUEUE_SIZE:512}
    mail:
        from: ${JHIPSTER_MAIL_FROM:test@localhost}
        base-url: ${JHIPSTER_MAIL_BASE_URL:http://127.0.0.1:8080}
    security:
        authentication:
            jwt:
                # Legacy plain-text secret. Empty by default so `base64-secret` below is used; kept as a
                # compatibility alias for deployments still setting JHIPSTER_SECURITY_AUTHENTICATION_JWT_SECRET.
                secret: ${JHIPSTER_SECURITY_AUTHENTICATION_JWT_SECRET:}
                # This token must be encoded using Base64 (you can type `echo 'secret-key'|base64` on your command line)
                base64-secret: ${JHIPSTER_SECURITY_AUTHENTICATION_JWT_BASE64_SECRET:YTA0N2NkMTQzMTI0OTUzOGNiNGNjMjdjMmUyNDYzYmM0OGMwNmExYzAzMmY3ZTk2YzlkODY2NzUzYTMzOTFhZjY5MzY2OTczOTY3N2YzNGZlMGUxZjliN2RlYjc1OTlkNmY1MjAwOTJlNTJkNmY1MDZjMDliODgzZjk4ZWEzYzQ=}
                # Token is valid 24 hours
                token-validity-in-seconds: ${JHIPSTER_SECURITY_AUTHENTICATION_JWT_TOKEN_VALIDITY_IN_SECONDS:86400}
