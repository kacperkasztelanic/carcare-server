# ===================================================================
# Spring Boot configuration — `test` profile.
#
# This file is layered on top of src/main/resources/config/application.yml
# (activated via config/application.properties) rather than replacing it.
# Only settings that must differ from the shared main configuration belong
# here — see AGENTS.md for the shadowing defect this replaces.
#
# This configuration is used for unit/integration tests.
# ===================================================================

spring:
    datasource:
        type: com.zaxxer.hikari.HikariDataSource
        url: jdbc:h2:mem:carcare;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
        name:
        username:
        password:
        hikari:
            auto-commit: false
    jpa:
        database-platform: com.kasztelanic.carcare.config.TestH2Dialect
        database: H2
        show-sql: false
        properties:
            # Hibernate 6 defaults OffsetDateTime/ZonedDateTime storage to AUTO, which falls back
            # to a database-native TIMESTAMP WITH TIME ZONE column. Liquibase's plain TIMESTAMP
            # columns (see 00000000000000_initial_schema.xml) never carried that, so normalize to
            # UTC instead of preserving the offset in the column type.
            hibernate.timezone.default_storage: NORMALIZE
            # This test-only identifier arrangement is the third documented divergence from
            # production, alongside F-04's TestH2Dialect CLOB boundary and timezone normalization.
            # H2 2.x treats VALUE as a keyword while Liquibase leaves event-table date columns
            # unquoted; reserve VALUE as a non-keyword, fold quoted and bare identifiers together,
            # and disable global auto-quoting so both schema styles resolve under H2.
            hibernate.auto_quote_keyword: false
            hibernate.connection.provider_disables_autocommit: true
            hibernate.cache.use_second_level_cache: false
            hibernate.cache.use_query_cache: false
            hibernate.generate_statistics: true
            hibernate.hbm2ddl.auto: validate
    liquibase:
        contexts: test
    mail:
        host: localhost
        port: 25
        username:
        password:
        tls: false
        properties.mail.smtp:
            auth: false
            starttls.enable: false
            ssl.trust:
    task:
        execution:
            pool:
                core-size: 1
        scheduling:
            pool:
                size: 1

server:
    port: 10344
    address: localhost

info:
    project:
        version: #project.version#

# ===================================================================
# Application specific properties
# Add your own application properties here, see the ApplicationProperties class
# to have type-safe configuration.
# ===================================================================

application:
    data-directory:
        location: data
    logging:
        # To test json console appender
        use-json-format: ${JHIPSTER_LOGGING_USE_JSON_FORMAT:true} # By default, logs are in Json format
        logstash:
            enabled: ${JHIPSTER_LOGGING_LOGSTASH_ENABLED:false}
            host: ${JHIPSTER_LOGGING_LOGSTASH_HOST:localhost}
            port: ${JHIPSTER_LOGGING_LOGSTASH_PORT:5000}
            queue-size: ${JHIPSTER_LOGGING_LOGSTASH_QUEUE_SIZE:512}
    mail:
        from: ${JHIPSTER_MAIL_FROM:test@localhost}
        base-url: ${JHIPSTER_MAIL_BASE_URL:http://127.0.0.1:8080}
    security:
        authentication:
            jwt:
                # Legacy plain-text secret. Empty by default so `base64-secret` below is used; kept as a
                # compatibility alias for deployments still setting JHIPSTER_SECURITY_AUTHENTICATION_JWT_SECRET.
                secret: ${JHIPSTER_SECURITY_AUTHENTICATION_JWT_SECRET:}
                # Test-only signing key, encoded as Base64. Freshly generated for this profile; it has
                # never signed a production token, and differs from the dev profile's value. Committing it
                # is intentional and is not a regression of the external-signing-key change.
                base64-secret: ${JHIPSTER_SECURITY_AUTHENTICATION_JWT_BASE64_SECRET:6hxA/QKxEhNYJBuztly+kyboC+459CBgMtCTaR6NDIpH78QJTx7f0XynlQI9rSVf+pXVYmZpEMdeCF9CPNgilw==}
                # Token is valid 24 hours
                token-validity-in-seconds: ${JHIPSTER_SECURITY_AUTHENTICATION_JWT_TOKEN_VALIDITY_IN_SECONDS:86400}
